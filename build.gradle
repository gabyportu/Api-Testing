plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    implementation 'io.rest-assured:rest-assured-common:6.0.1'
    implementation 'io.rest-assured:json-schema-validator:6.0.1'
    testImplementation 'io.rest-assured:rest-assured-all:6.0.1'
    testImplementation 'org.json:json:20260814'

    implementation 'io.cucumber:cucumber-java:8.0.4'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:8.0.4'

    testImplementation platform('com.fasterxml.jackson:jackson-bom:2.22.0')
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
}

test {
    useJUnitPlatform()
}

configurations {
    cucumberRuntime {
        extendsFrom testImplementation
    }
}

tasks.register('cucumberCli', JavaExec) {
    group = 'verification'
    description = 'Ejecuta escenarios Cucumber por etiqueta'
    dependsOn tasks.named('testClasses')
    mainClass.set('io.cucumber.core.cli.Main')
    classpath = sourceSets.test.runtimeClasspath

    def suite = providers.gradleProperty('suite').getOrElse('@Regression')
    args(
            '--plugin', 'pretty',
            '--plugin', 'html:report/cucumber-report.html',
            '--glue', 'runner',
            '--tags', suite,
            'src/test/resources'
    )
}

